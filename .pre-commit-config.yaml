# 口才训练营 开发门禁 · pre-commit
# 安装: pip install pre-commit && pre-commit install
# 手动跑: pre-commit run --all-files

repos:
  # ── Python: ruff (lint + format 一体) ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^server/
      - id: ruff-format
        files: ^server/

  # ── 通用: 禁止提交大文件 ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: check-merge-conflict
      - id: debug-statements

  # ── 安全: 禁止密钥硬编码提交 ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
      - id: check-ast

  # ── 前端: prettier 格式化检查 (轻量, 不强制 eslint) ──
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(vue|js|json|css|scss|md)$
        exclude: ^(dist/|node_modules/|.*/dist/)
