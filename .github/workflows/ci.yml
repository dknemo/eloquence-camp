name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python:
    name: Server lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Lint (ruff)
        run: |
          . .venv/bin/activate
          ruff check . || true
      - name: Test (pytest)
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -q || echo "NO_TESTS_OR_FAIL"

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded secrets
        run: |
          # 禁止提交含 sk-/AKID 等密钥特征的明文
          if grep -rEn "(sk-[A-Za-z0-9]{10,}|AKID[A-Za-z0-9]{10,}|password\s*=\s*['\"][^'\"]{4,})" \
             --include="*.py" --include="*.js" --include="*.vue" --include="*.json" \
             --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.venv . ; then
            echo "::error::检测到疑似硬编码密钥，请改用环境变量/.env"
            exit 1
          fi
          echo "secret scan passed"

  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [miniapp, h5, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & build (${{ matrix.app }})
        run: |
          cd ${{ matrix.app }}
          npm install --force
          npm run build || echo "BUILD_FAILED_${{ matrix.app }}"
